name: ELAN GO Platform CI

on:
  push:
    branches:
      - feature/ELAN-GO-CONTROL-UI-01
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NPM_CONFIG_CACHE: /tmp/elan-go-npm-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint ELAN GO surface
        run: npx eslint src/App.jsx src/components/ElanGoStatus.jsx

      - name: Build
        run: npm run build
